name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every dependency except ultralytics' minor series is unpinned upwards, so
  # an upstream release can break a fresh install without any commit here
  # (ultralytics 8.4.171 did). A weekly run notices that before a user does.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  # Keeps the clone from growing again. History already carries ~85 MiB of
  # old weights and archives; anything new over 5 MB belongs in a GitHub
  # Release asset, not in git. Models/BOX_TRAINED.pt is the one exception.
  repo-size:
    name: No large files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on tracked files over 5 MB
        run: |
          git ls-files -z | xargs -0 stat -c '%s %n' \
            | awk '$1 > 5000000 && $2 != "Models/BOX_TRAINED.pt" { print; bad = 1 } END { exit bad }'

  # Proves `pip install -r requirements.txt` actually resolves on every
  # supported interpreter, and runs the tests that do not need the model.
  #
  # This job is the direct guard against the blockers this repo shipped with:
  # numpy==1.24.4 had no cp312/cp313 wheels so the install itself failed, and
  # ultralytics==8.0.196 could not unpickle the YOLO11 weights.
  install-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Show resolved versions
        run: pip freeze

      - name: Check dependency consistency
        run: pip check

      - name: Lint (rules pinned in ruff.toml)
        run: ruff check .

      - name: Import the app without loading the model
        # app.py must import cleanly. The processor is lazy (see
        # get_processor()), so this stays fast and still catches syntax
        # errors, bad imports and Flask config mistakes.
        env:
          DATABASE_PATH: ci_items.db
          SECRET_KEY: ci-not-a-real-key
        run: python -c "import app; print('app imported OK'); print(sorted(r.rule for r in app.app.url_map.iter_rules()))"

      - name: Fast tests
        env:
          DATABASE_PATH: ci_items.db
          SECRET_KEY: ci-not-a-real-key
        run: pytest -q -m "not slow"

  # The exact versions in requirements.lock. The matrix above tests what a new
  # install resolves to today; this job tests a fixed set, so when only the
  # matrix fails the cause is an upstream release, not a change in this repo.
  locked:
    name: Locked dependencies (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install requirements.lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Check dependency consistency
        run: pip check

      - name: Fast tests
        env:
          DATABASE_PATH: ci_items.db
          SECRET_KEY: ci-not-a-real-key
        run: pytest -q -m "not slow"

  # The golden-image regression: runs the real YOLO + EasyOCR pipeline against a
  # committed screenshot. Kept to a single interpreter because the first run
  # downloads ~100 MB of EasyOCR weights.
  golden-image:
    name: Golden image pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Cache EasyOCR models
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-models-v1

      - name: Run golden-image test
        env:
          DATABASE_PATH: ci_items.db
          SECRET_KEY: ci-not-a-real-key
        run: pytest -q -m slow
